name: Green-Cart_CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - run: npm ci
      - run: npm run lint

  docker:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ENV files
        env:
          SERVER_SECRETS: ${{ secrets.SERVER_SECRETS }}
          CLIENT_SECRETS: ${{ secrets.CLINET_SECRETS }}  
        run: |
          printf '%s\n' "$SERVER_SECRETS" > server/.env
          printf '%s\n' "$CLIENT_SECRETS" > client/.env

      - name: Build images
        run: docker compose build

      - name: Start application
        run: docker compose up -d --wait --wait-timeout 120

      - name: Container status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down -v