services: 
  client: 
    build: ./client
    env_file:
      - ./client/.env
    depends_on:
      - server
    ports:
      - "5173:5173"
    networks:
      - green_cart
  
  server: 
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    networks:
      - green_cart
    
networks:
  green_cart:
    driver: bridge