services: 
  client: 
    build: ./client
    env_file:
      - ./client/.env
    depends_on:
      - server
    ports:
      - "5173:5173"
    networks:
      - green_cart
  
  server: 
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    networks:
      - green_cart
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
networks:
  green_cart:
    driver: bridge